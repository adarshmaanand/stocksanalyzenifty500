{
"name": "Nifty 500 stocks",
"on": {"schedule": [{"cron": "0 3 * * 0"}], "workflow_dispatch": {}},
"jobs": {"report": {"runs-on": "ubuntu-latest", "timeout-minutes": 90, "steps": [
{"name": "Checkout repo", "uses": "actions/checkout@v4"},
{"name": "Set up Python", "uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}},
{"name": "Install dependencies", "run": "pip install -r requirements.txt"},
{"name": "Clean pasted characters", "run": "sed -i 's/\\xC2\\xA0/ /g' stock_screener.py"},
{"name": "Run stock script", "run": "python stock_screener.py", "env": {"MAX_STOCKS": "0"}},
{"name": "Email the Excel file", "uses": "dawidd6/action-send-mail@v3", "with": {"server_address": "smtp.gmail.com", "server_port": 465, "secure": true, "username": "${{ secrets.EMAIL_USER }}", "password": "${{ secrets.EMAIL_APP_PASSWORD }}", "subject": "Nifty 500 Value + Growth Picks", "to": "${{ secrets.EMAIL_TO }}", "from": "Stock Bot <${{ secrets.EMAIL_USER }}>", "body": "file://top_picks.txt", "attachments": "stock_ranking.xlsx"}}
]}}
}
